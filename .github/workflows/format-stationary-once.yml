name: Temporary stationary component formatting
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-once:
    if: github.event.pull_request.head.repo.full_name == 'ariadne-cps/integration' && github.head_ref == 'fix/stationary-parameterised-components'
    runs-on: macos-26
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/stationary-parameterised-components
          persist-credentials: true
      - name: Install formatting tools
        run: brew install ninja pkg-config clang-format
      - name: Initialize Build submodule
        run: git submodule update --init -- ss/bui
      - name: Configure format
        run: |
          cmake -S . -B "${{ runner.temp }}/format-build" -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DARIADNE_CLANG_FORMAT_EXECUTABLE="$(brew --prefix clang-format)/bin/clang-format"
      - name: Apply canonical format and remove temporary workflow
        run: |
          cmake --build "${{ runner.temp }}/format-build" --target apply-format
          git add include/integration/integrator.hpp src/integrator.cpp tests/test_preconditioned_integrator.cpp
          git rm .github/workflows/format-stationary-once.yml
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "style(integration): canonical formatting of stationary component fix"
          git push origin HEAD:fix/stationary-parameterised-components
