# Temporary, branch-scoped formatter. It removes itself in its own commit.
name: One-time format preconditioned invariant fix
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-once:
    if: github.event.pull_request.head.repo.full_name == 'ariadne-cps/integration' && github.head_ref == 'test/preconditioned-constant-invariant'
    runs-on: macos-26
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: test/preconditioned-constant-invariant
          persist-credentials: true

      - name: Install clang-format
        run: brew install ninja pkg-config clang-format

      - name: Initialize Build submodule
        run: git submodule update --init -- ss/bui

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.temp }}/format-build" -G Ninja \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DARIADNE_CLANG_FORMAT_EXECUTABLE="$(brew --prefix clang-format)/bin/clang-format"

      - name: Format integrator, remove one-time workflow, and push
        run: |
          cmake --build "${{ runner.temp }}/format-build" --target apply-format
          git add src/integrator.cpp
          git rm .github/workflows/format-preconditioned-once.yml
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "style(integration): apply canonical clang-format 23 to invariant fix"
          git push origin HEAD:test/preconditioned-constant-invariant
