name: macOS

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "macOS 26 arm AppleClang 21", os: macos-26, cxx: "/usr/bin/clang++" }

    steps:
    - uses: actions/checkout@v7

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.18.0"

    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install Python Test Dependencies
      if: matrix.build_type == 'Debug'
      run: python -m pip install pytest

    - name: Get macOS Concurrency
      if: runner.os == 'macOS'
      run: echo "NPROC=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"

    - name: Set Up macOS Dependencies
      if: runner.os == 'macOS'
      run: brew install ninja pkg-config

    - name: Create Build Environment
      run: cmake -E make_directory ${{ runner.workspace }}/build

    - name: Configure CMake
      working-directory: ${{ runner.workspace }}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -G Ninja -DWARNINGS_AS_ERRORS=ON -DPYTHON_ENFORCE_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}

    - name: Build
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --parallel $NPROC --target everything

    - name: Test C++
      id: cpp_tests
      if: matrix.build_type == 'Debug'
      working-directory: ${{ runner.workspace }}/build
      run: ctest -j $NPROC -LE python --output-on-failure

    # A libstdc++ checked-iterator abort lacks a C++ call-site in the CTest
    # output. Only on a failing GCC Debug test, collect a symbolic backtrace.
    - name: Diagnose GCC Debug iterator abort
      if: ${{ always() && matrix.build_type == 'Debug' && matrix.config.libstdcxx_debug && steps.cpp_tests.outcome == 'failure' }}
      working-directory: ${{ runner.workspace }}/build
      run: |
        sudo apt-get install -y gdb
        gdb -q -batch -ex 'set pagination off' -ex run -ex 'bt 40' --args ./tests/test_integrator > iterator-backtrace.txt 2>&1 || true
        echo '--- GCC Debug iterator backtrace ---'
        tail -n 125 iterator-backtrace.txt

    - name: Upload GCC Debug backtrace
      if: ${{ always() && matrix.build_type == 'Debug' && matrix.config.libstdcxx_debug && steps.cpp_tests.outcome == 'failure' }}
      uses: actions/upload-artifact@v4
      with:
        name: integration-gcc-debug-backtrace
        path: ${{ runner.workspace }}/build/iterator-backtrace.txt
        if-no-files-found: error

    - name: Test Python
      if: matrix.build_type == 'Debug'
      working-directory: ${{ runner.workspace }}/build
      run: ctest -L python -V --output-on-failure

    - name: Install Ariadne Integration
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/build
      run: cmake --install . --prefix ${{ runner.workspace }}/install

    - name: Check Python Integration Tutorial
      if: matrix.build_type == 'Release'
      working-directory: ${{ github.workspace }}/python/tutorials
      env:
        PYTHONPATH: ${{ runner.workspace }}/install/lib/python3.13/site-packages
        LD_LIBRARY_PATH: ${{ runner.workspace }}/install/lib
        DYLD_LIBRARY_PATH: ${{ runner.workspace }}/install/lib
      run: |
        python -c "import os, pathlib, pyariadne; p=pathlib.Path(pyariadne.__file__).resolve(); root=pathlib.Path(os.environ['PYTHONPATH']).resolve(); assert p.is_relative_to(root), (p, root)"
        python tutorial_integration.py


    - name: Prepare C++ Integration Tutorial
      if: matrix.build_type == 'Release'
      run: cmake -E copy_directory $GITHUB_WORKSPACE/tutorials/tutorial_integration ${{ runner.workspace }}/tutorial_integration

    - name: Check C++ Integration Tutorial
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/tutorial_integration
      run: |
        cmake -S . -B build -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/install -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -G Ninja
        cmake --build build --parallel $NPROC
        export LD_LIBRARY_PATH=${{ runner.workspace }}/install/lib:${LD_LIBRARY_PATH:-}
        export DYLD_LIBRARY_PATH=${{ runner.workspace }}/install/lib:${DYLD_LIBRARY_PATH:-}
        ./build/tutorial_integration


    - name: Verify Uninstallation
      if: matrix.build_type == 'Release'
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --target uninstall

